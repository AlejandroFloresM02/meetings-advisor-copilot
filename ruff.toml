# Ruff config for the whole repo (backend/, OpenRouter_Agent/, scripts/).
# Pytest config stays in backend/pyproject.toml; this file owns lint + format.

target-version = "py312"  # langchain-openrouter requires 3.12
line-length = 88
src = ["backend", "OpenRouter_Agent", "."]
extend-exclude = [
    "backend/data",
    "*.xlsx",
    ".venv",
    "node_modules",
    "dist",
    "build",
]

[lint]
# Strict, broad selection — practical strictness, not every pedantic rule.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PIE",      # flake8-pie
    "RET",      # flake8-return
    "RSE",      # flake8-raise
    "TID",      # flake8-tidy-imports
    "ICN",      # flake8-import-conventions
    "PT",       # flake8-pytest-style
    "S",        # flake8-bandit (security)
    "A",        # flake8-builtins (shadowing)
    "RUF",      # ruff-specific rules
]
ignore = [
    "E501",  # line length is owned by the formatter
    "B008",  # FastAPI Depends() in argument defaults is idiomatic
]

[lint.per-file-ignores]
"**/test_*.py" = ["S101"]       # asserts are the point of tests
"**/conftest.py" = ["S101"]
"**/__init__.py" = ["F401"]     # re-exports
# Intentional verify=False TLS workaround (POC unblock, see CLAUDE.md):
"backend/app/llm/openrouter_client.py" = ["S501"]
"OpenRouter_Agent/agent.py" = ["S501"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
