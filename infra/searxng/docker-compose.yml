# Self-hosted SearXNG for offline corpus construction (spec §4). Start once to
# record fixtures: `docker compose -f infra/searxng/docker-compose.yml up -d`.
services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
